<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a0f"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
    <filter id="bolt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bg)" stroke="#1a3a2a" stroke-width="3"/>
  
  <!-- Keyboard base -->
  <g filter="url(#shadow)">
    <!-- Keyboard body -->
    <rect x="180" y="480" width="664" height="320" rx="32" ry="32" fill="#141414" stroke="#10b981" stroke-width="3" opacity="0.9"/>
    
    <!-- Key row 1 -->
    <rect x="220" y="516" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="290" y="516" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="360" y="516" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="430" y="516" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="500" y="516" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="570" y="516" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="640" y="516" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="710" y="516" width="96" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Key row 2 -->
    <rect x="220" y="580" width="76" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="310" y="580" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="380" y="580" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="450" y="580" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="520" y="580" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="590" y="580" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="660" y="580" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="730" y="580" width="76" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Key row 3 (spacebar row) -->
    <rect x="220" y="644" width="96" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="330" y="644" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="400" y="644" width="224" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="2" opacity="0.8"/>
    <rect x="638" y="644" width="56" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <rect x="708" y="644" width="98" height="48" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Key row 4 -->
    <rect x="220" y="710" width="56" height="44" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
    <rect x="290" y="710" width="56" height="44" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
    <rect x="360" y="710" width="56" height="44" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
    <rect x="430" y="710" width="166" height="44" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
    <rect x="610" y="710" width="56" height="44" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
    <rect x="680" y="710" width="56" height="44" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
    <rect x="750" y="710" width="56" height="44" rx="8" fill="#1f2f1f" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Lightning bolt -->
  <g filter="url(#bolt-glow)">
    <polygon points="560,120 420,400 520,400 460,520 640,260 530,260 600,120" fill="url(#glow)" opacity="0.95"/>
  </g>
</svg>
